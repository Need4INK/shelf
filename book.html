<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html{background:#0e0416;color-scheme:dark;scrollbar-width:none}::-webkit-scrollbar{display:none}</style>
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="app-version" content="book-45">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0724">
<title>Book</title>
<link rel="stylesheet" href="book-frame.css">
<style>
/* Book page: a witchy library page. Dark purple room, the framed book as the hero,
   a parchment card of details, the tab bar at the bottom like every page. */
:root{color-scheme:dark;--ink:#f3e3c3;--gold:#e9c873;--gold2:#c9a24e;--mute:#c8a6c8}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{background:#14051c}
body{min-height:100vh;color:#f3e3c3;font:17px/1.5 "EB Garamond",Georgia,serif;-webkit-tap-highlight-color:transparent;
 background:radial-gradient(120% 60% at 50% 0%,#4a1a5e 0%,#2a0b38 45%,#14051c 100%) fixed;
 padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 120px)}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px;color:var(--gold);text-decoration:none;font-size:18px}
.back svg{width:18px;height:18px}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 18px;position:relative}
.hero::before{content:"";position:absolute;top:0;left:50%;width:300px;height:300px;transform:translateX(-50%);
 background:radial-gradient(closest-side,rgba(233,200,115,.22),transparent);pointer-events:none}
.hero .bk{width:min(52vw,210px)}
/* change cover: gold camera badge on the book's bottom-right corner */
.bkw{position:relative}
/* Owned/Wishlist and pumpkins change only in Edit book */
#page:not(.editing) .status button,#page:not(.editing) .pk{pointer-events:none}
.covcam{position:absolute;right:-12px;bottom:-10px;width:46px;height:46px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;
 background:linear-gradient(#f6dc96,#c9a24e);box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 1px 0 #fff4c8,0 0 0 2px rgba(42,20,8,.6);-webkit-tap-highlight-color:transparent}
.covcam svg{width:24px;height:24px}.covcam:active{transform:scale(.94)}
.covcam.orig{right:auto;left:-12px;overflow:visible}
.covcam.orig span{position:absolute;right:100%;top:50%;transform:translateY(-50%);margin-right:7px;text-align:right;font:italic 14px/1.1 "EB Garamond",Georgia,serif;color:#e0c79e;text-shadow:0 1px 2px #000;pointer-events:none}
h1{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:32px;line-height:1.08;margin:18px 0 4px;color:#f6e2b0;text-wrap:balance;text-shadow:0 2px 3px rgba(0,0,0,.5)}
.sub{font-style:italic;color:#e0c79e;margin:0 0 6px;text-wrap:balance}
.by{font-size:19px;color:#f3e3c3;margin:0}
.series{margin:8px 0 0;font-size:15px;color:var(--gold);letter-spacing:.2px}

.card{position:relative;margin:16px 0;padding:28px 28px 28px;border-radius:24px;color:#f3e3c3;
 background:linear-gradient(rgba(40,8,46,.25),rgba(20,4,26,.45)),url(img/panel.jpg) center/cover;
 box-shadow:0 10px 22px rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.4)}
/* hand-painted gold rim and leaf sprigs, like the Home banner */
.card::before{content:"";position:absolute;inset:0;pointer-events:none;border-style:solid;border-color:transparent;border-width:42px;border-image:url(img/card_frame.webp) 190 stretch}
.card>*{position:relative;z-index:1}
.card h2{margin:0 0 12px;font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:22px;color:#f1cf7c}

.status{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:999px;background:#14041c;box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.status button{min-height:44px;border:0;border-radius:999px;background:transparent;color:#e7cfa6;font:600 17px "EB Garamond",Georgia,serif;cursor:pointer}
.status button[aria-pressed=true]{background:linear-gradient(#f6dc96,#c9a24e);color:#2a1408;box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 1px 0 #fff4c8}
.rate{display:flex;align-items:center;gap:2px;margin-top:14px}
.rate span{font-size:16px;margin-right:4px;color:var(--mute);position:relative;top:4px;white-space:nowrap}
.pk{width:44px;height:44px;flex:none;border:0;padding:3px;background:transparent;cursor:pointer;opacity:.3;filter:grayscale(1) brightness(.9);transition:opacity .15s,transform .2s,filter .15s}
.pk.on{animation:bob .35s ease-out}
@keyframes bob{40%{transform:translateY(-4px) scale(1.12)}}
.pk.on{opacity:1;filter:none}
.pk:active{transform:scale(.9)}
.pk img{width:100%;height:100%;object-fit:contain;display:block}
.pk.on img{filter:drop-shadow(0 0 6px rgba(255,150,50,.45))}

dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:0}
dd{padding-left:14px!important}
dt,dd{padding:9px 0;border-top:1px solid rgba(201,162,78,.22)}
dt:first-of-type,dd:first-of-type{border-top:0}
dt{color:var(--mute);font-size:15px;white-space:nowrap;padding-top:11px}
dd{margin:0;text-align:right;overflow-wrap:anywhere}
dd input{width:100%;min-height:36px;border:0;border-bottom:1px dashed rgba(233,200,115,.45);background:transparent;color:var(--ink);font:16px "EB Garamond",Georgia,serif;text-align:right;padding:2px 0}
dd select{width:100%;min-height:36px;border:0;border-bottom:1px dashed rgba(233,200,115,.45);background:transparent;color:var(--ink);font:16px "EB Garamond",Georgia,serif;text-align:right;text-align-last:right;padding:2px 0;-webkit-appearance:none;appearance:none}
dd select option{color:#000}
dd select:focus,dd input:focus{outline:none;border-bottom:2px solid #e9c873}
dd input::placeholder{color:rgba(243,227,195,.4);font-style:italic}
.ser{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:8px}
.desc p{margin:0;white-space:pre-line}
.desc.clamp p{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:6px;min-height:40px;border:0;background:transparent;color:#e9c873;font:600 16px "EB Garamond",Georgia,serif;padding:0;cursor:pointer}
.empty{text-align:center;padding:80px 10px;color:#e0c79e}
.empty a{color:var(--gold)}
.saved{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);padding:6px 14px;border-radius:999px;
 background:#2a0b38;border:1px solid var(--gold2);color:var(--gold);font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
.saved.show{opacity:1}
.note{font-size:13px;color:rgba(243,227,195,.55);text-align:center;margin:4px 0 0}
/* Edit book + Remove side by side under the cards */
.acts{display:flex;gap:10px;margin:22px 0 6px}
.acts button{flex:1}
.edit{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid rgba(232,190,140,.5);background:rgba(30,6,20,.55);color:#f1dcc0;font:600 17px "EB Garamond",Georgia,serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.edit.done{background:linear-gradient(180deg,#f3d29a,#d9a066);color:#2a1410;border:0;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.remove{display:block;margin:0;min-height:44px;padding:0 22px;border-radius:999px;border:1.5px solid rgba(255,154,138,.45);background:rgba(30,6,20,.55);color:#ff9a8a;font:600 17px "EB Garamond",Georgia,serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.remove.sure{background:#7a1f2a;border-color:#ff9a8a;color:#ffe6df}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);
 background:linear-gradient(transparent,#0d0310 calc(100% - env(safe-area-inset-bottom,0px)))}
#tabbar .in{position:relative;width:calc(824px * var(--S,.4577));margin:0 auto}
#tabbar img{display:block;width:100%;height:auto;pointer-events:none}
#tabbar .tb{position:absolute;top:8%;width:22%;height:calc(92% + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer}
#tabbar .barbook{position:absolute;left:19.21%;width:61.57%;height:auto;bottom:23.98%;pointer-events:none}
#tabbar .bookmagic{position:absolute;left:-1.6%;width:103.2%;bottom:23.98%;pointer-events:none}
#tabbar .bookhit{position:absolute;left:34.6%;width:30.8%;bottom:calc(0px - env(safe-area-inset-bottom,0px));height:calc(98% + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;cursor:pointer}
#tabbar .tb:active{background:radial-gradient(closest-side,rgba(255,170,90,.38),transparent)}
</style>
<style>/* Same as the Library: the page itself never moves or bounces, only its content scrolls (inside the body).
   On the iPhone a bouncing page swallowed taps on the bottom bar; this keeps the bar quick on every page. */
html{height:100%;overflow:hidden;overscroll-behavior:none;background:radial-gradient(120% 60% at 50% 0%,#4a1a5e 0%,#2a0b38 45%,#14051c 100%)}
body{height:100%;min-height:0;box-sizing:border-box;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;background:none}
/* always a little scrollable, so a swipe never falls through to the page */
body::before{content:"";float:left;width:1px;margin-right:-1px;height:calc(100% + 1px)}
</style>
<script>(function(){
  const p=document.createElement('div');p.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
  document.documentElement.appendChild(p);
  const fit=()=>document.documentElement.style.setProperty('--S',Math.max(innerWidth/852,(innerHeight-(p.offsetHeight||0))/1810));
  fit();addEventListener('resize',fit);
  // tapping Home when we came from Home: go back, so the phone shows the Home it kept in memory (no rebuild)
  // bar buttons have no web link (a long press would open the iPhone link menu); go there on tap
  addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('#tabbar [data-go]');if(a&&!e.defaultPrevented){e.preventDefault();location.href=a.dataset.go}});
  // iPhone only shows the pressed glow when the page listens for touches
  document.addEventListener('touchstart',()=>{},{passive:true});
  // the bar keeps its own touches: it never scrolls what is under it (the shelves on Library/Wishlist could take the
  // touch, so taps were lost), and lifting the finger on the same button counts as a tap
  document.addEventListener('DOMContentLoaded',()=>{const t=document.getElementById('tabbar');if(!t)return;
    t.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
    t.addEventListener('touchend',e=>{const a=e.target.closest&&e.target.closest('.tb'),p=e.changedTouches[0];if(!a||!p)return;
      const h=document.elementFromPoint(p.clientX,p.clientY);if(h&&h.closest&&h.closest('.tb')===a&&e.cancelable){e.preventDefault();a.click()}});});
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('#tabbar a[aria-label="Home"]');if(!a)return;
    let r=null;try{r=new URL(document.referrer)}catch(err){}
    if(r&&r.origin===location.origin&&/\/(index\.html)?$/.test(r.pathname)&&history.length>1){e.preventDefault();
      // if the phone ignores going back (it can, e.g. after the app was in the background), open Home directly
      const t=setTimeout(()=>{location.href=a.dataset.go||'index.html'},600);addEventListener('pagehide',()=>clearTimeout(t),{once:true});history.back()}});
})();</script>
<style>/* All app lettering, kept in the app (no Google Fonts) so text never swaps fonts when a page opens. OFL. */
@font-face{font-family:"EB Garamond";font-weight:400;src:url(fonts/EBGaramond-400.woff2) format("woff2");font-display:block}
@font-face{font-family:"EB Garamond";font-weight:500;src:url(fonts/EBGaramond-500.woff2) format("woff2");font-display:block}
@font-face{font-family:"EB Garamond";font-weight:600;src:url(fonts/EBGaramond-600.woff2) format("woff2");font-display:block}
@font-face{font-family:"EB Garamond";font-weight:700;src:url(fonts/EBGaramond-700.woff2) format("woff2");font-display:block}
@font-face{font-family:"EB Garamond";font-weight:400;font-style:italic;src:url(fonts/EBGaramond-400i.woff2) format("woff2");font-display:block}
@font-face{font-family:"IM Fell English";src:url(fonts/IMFellEnglish.woff2) format("woff2");font-display:block}
@font-face{font-family:"IM Fell English";font-style:italic;src:url(fonts/IMFellEnglishItalic.woff2) format("woff2");font-display:block}
@font-face{font-family:"IM Fell English SC";src:url(fonts/IMFellEnglishSC.woff2) format("woff2");font-display:block}
</style>
</head>
<body>
<div class="wrap">
  <main id="page"></main>
</div>
<div class="saved" id="saved" role="status">Saved</div>
<nav id="tabbar" aria-label="Sections">
  <div class="in">
    <img src="img/tabbar.webp" width="851" height="171" alt="">
    <img class="barbook" src="img/bar_book.webp" alt="">
    <a class="tb" style="left:0" data-go="./" role="link" aria-label="Home"></a>
    <a class="tb" style="left:78%" data-go="backup.html" role="link" aria-label="Backup"></a>
  </div>
</nav>
<script src="bookmagic.js"></script>
<script src="store.js"></script>
<script src="book-frame.js"></script>
<script src="cover-photo.js"></script>
<script>
{
let ALL=[],editing=false;
// edit mode works on a copy: nothing is stored until Save (Cancel throws it away)
let draft=null,newCover=null,newCoverURL=null,dropOwn=false;
const endEdit=()=>{editing=false;draft=null;newCover=null;dropOwn=false;if(newCoverURL)URL.revokeObjectURL(newCoverURL);newCoverURL=null};
const load=()=>ALL;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const page=document.getElementById('page');
let id=new URLSearchParams(location.search).get('id');

const LANG={en:'English',ro:'Romanian',fr:'French',de:'German',es:'Spanish',it:'Italian',hu:'Hungarian',ru:'Russian',pt:'Portuguese',nl:'Dutch',pl:'Polish',ja:'Japanese'};
const pumpkin='<img src="img/pumpkin_icon.png" alt="">';

function save(mut){
  const b=ALL.find(x=>x.id===id);if(!b)return;mut(b);
  Store.put(b).then(()=>{const s=document.getElementById('saved');s.classList.add('show');clearTimeout(save.t);save.t=setTimeout(()=>s.classList.remove('show'),1100)}).catch(()=>{});
  return b;
}
function year(p){const m=String(p||'').match(/\d{4}/);return m?m[0]:''}

function render(){
  const all=load();
  const real=id?all.find(x=>x.id===id):all.slice().sort((x,y)=>(y.added||0)-(x.added||0))[0];
  if(real)id=real.id;
  const b=editing&&draft?draft:real;
  if(!b){page.innerHTML='<div class="empty">This book isn\'t in your collection.<br><a href="./">Back to Home</a></div>';return}
  document.title=b.title||'Book';
  const status=b.status==='wishlist'?'wishlist':'owned',rating=b.rating||0;
  const inp=(fid,v,ph,extra='')=>`<input id="${fid}" placeholder="${ph}" value="${esc(v)}" autocomplete="off"${extra}>`;
  const rows=(editing?[
    ['Title',inp('fTitle',b.title,'Title')],['Author',inp('fAuthor',(b.authors||[]).join(', '),'Author(s), comma between')],
    ['Genre',`<select id="fGenre" aria-label="Genre">${GENRES.map(g=>`<option${g===(GENRES.includes(b.genre)?b.genre:'Other')?' selected':''}>${g}</option>`).join('')}</select>`],
    ['Series',`<div class="ser">${inp('fSeries',b.series,'Series name')}${inp('fSeriesNo',b.seriesNo,'No.',' inputmode="decimal"')}</div>`],
    ['Edition',inp('fEdition',b.edition,'e.g. Hardback, special edition')],
    ['Publisher',inp('fPublisher',b.publisher,'Publisher')],['Published',inp('fPublished',year(b.published)||b.published,'Year',' inputmode="numeric"')],
    ['Pages',inp('fPages',b.pages,'Pages',' inputmode="numeric"')],
    ['ISBN-13',esc(b.isbn13)],['ISBN-10',esc(b.isbn10)],
  ]:[
    ['Genre',esc(GENRES.includes(b.genre)?b.genre:'Other')],['Series',b.series?esc(b.series)+(b.seriesNo?' · Book '+esc(b.seriesNo):''):''],['Edition',esc(b.edition)],
    ['Publisher',esc(b.publisher)],['Published',esc(year(b.published)||b.published)],['Pages',esc(b.pages)],
    ['Language',esc(LANG[b.language]||b.language)],['ISBN-13',esc(b.isbn13)],['ISBN-10',esc(b.isbn10)],
    ['Added',b.added?new Date(b.added).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'']
  ]).filter(r=>r[1]);
  page.classList.toggle('editing',editing);
  page.innerHTML=`
  <section class="hero">
    <div class="bkw"><div class="bk" id="bk">${bookFrameHTML()}</div>${editing&&!dropOwn&&(newCover||Store.isOwn(real.cover))&&(real.webCover||(real.cover&&!Store.isOwn(real.cover)))?'<button class="covcam orig" id="orig" aria-label="Restore the original cover"><svg viewBox="0 0 24 24" fill="none" stroke="#2a1408" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v5h5"/><path d="M5.5 15a7 7 0 1 0 1.6-7.3L4 10"/></svg><span>Restore<br>original</span></button>':''}${editing?'<button class="covcam" id="covcam" aria-label="Change cover photo"><svg viewBox="0 0 24 24" fill="none" stroke="#2a1408" stroke-width="2" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13.5" r="3.6"/></svg></button>':''}</div>
    <h1>${esc(b.title||'Untitled')}</h1>
    ${b.subtitle?`<p class="sub">${esc(b.subtitle)}</p>`:''}
    <p class="by">${esc((b.authors||[]).join(', ')||'Unknown author')}</p>
    ${b.series?`<p class="series">${esc(b.series)}${b.seriesNo?' · Book '+esc(b.seriesNo):''}</p>`:''}
  </section>

  <section class="card" aria-label="In my collection">
    <h2>In my collection</h2>
    <div class="status" role="group" aria-label="Status">
      <button id="sOwn" aria-pressed="${status==='owned'}">Owned</button>
      <button id="sWish" aria-pressed="${status==='wishlist'}">Wishlist</button>
    </div>
    <div class="rate" role="group" aria-label="My rating"><span>My Rating</span>
      ${[1,2,3,4,5].map(n=>`<button class="pk${n<=rating?' on':''}" data-n="${n}" aria-label="${n} pumpkin${n>1?'s':''}">${pumpkin}</button>`).join('')}
    </div>
  </section>

  <section class="card" aria-label="Details">
    <h2>${editing?'Edit details':'Details'}</h2>
    <dl>
      ${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}
    </dl>
  </section>

  ${b.description?`<section class="card desc clamp" aria-label="Description"><h2>About this book</h2><p id="dText"></p><button class="more" id="more" hidden>Read more</button></section>`:''}
  ${editing?'<p class="note">Nothing changes until you tap Save.</p>':''}
  <div class="acts">${editing?'<button class="edit" id="cancel">Cancel</button><button class="edit done" id="ed">Save</button>':'<button class="edit" id="ed">Edit book</button><button class="remove" id="rm">Remove</button>'}</div>`;

  // in edit mode show what Save would store: the new photo, or the original web cover (no id, so the saved picture isn't used)
  setBook(document.getElementById('bk'),editing&&newCoverURL?{...b,id:undefined,cover:newCoverURL,color:null}:editing&&dropOwn?{...b,id:undefined,color:null}:b);
  if(b.description){
    const p=document.getElementById('dText');p.textContent=String(b.description).replace(/<[^>]+>/g,'');
    requestAnimationFrame(()=>{const m=document.getElementById('more');if(p.scrollHeight>p.clientHeight+4){m.hidden=false;m.onclick=()=>{const c=p.parentNode.classList.toggle('clamp');m.textContent=c?'Read more':'Show less'}}});
  }
  const setStatus=v=>{if(!editing)return;draft.status=v;document.getElementById('sOwn').setAttribute('aria-pressed',v==='owned');document.getElementById('sWish').setAttribute('aria-pressed',v==='wishlist')};
  document.getElementById('sOwn').onclick=()=>setStatus('owned');
  document.getElementById('sWish').onclick=()=>setStatus('wishlist');
  page.querySelectorAll('.pk').forEach(btn=>btn.onclick=()=>{
    const n=+btn.dataset.n,cur=(editing?draft:load().find(x=>x.id===id)||{}).rating||0,v=n===cur?0:n;   // tap the same pumpkin again to clear
    if(!editing)return;draft.rating=v;page.querySelectorAll('.pk').forEach(p=>p.classList.toggle('on',+p.dataset.n<=v));
  });
  // edit mode: Edit book → work on a copy; Save stores it (and the new cover), Cancel drops it
  const ed=document.getElementById('ed');
  if(!editing)ed.onclick=()=>{draft=JSON.parse(JSON.stringify(real));editing=true;render();document.body.scrollTo({top:0,behavior:'smooth'})};
  if(editing){
  ed.onclick=async()=>{
    ed.disabled=true;const nb=draft;
    try{
      if(newCover){await Store.setCover(id,newCover);if(real.cover&&!Store.isOwn(real.cover))nb.webCover=real.cover;nb.cover='own:'+Date.now();delete nb.color}
      else if(dropOwn){await Store.dropCover(id);nb.cover=nb.webCover||real.webCover;delete nb.webCover;delete nb.color}
      await Store.put(nb);
    }catch(e){ed.disabled=false;return}
    if(dropOwn)Store.saveCover(nb);
    const k=ALL.findIndex(x=>x.id===id);if(k>=0)ALL[k]=nb;
    endEdit();render();document.body.scrollTo({top:0,behavior:'smooth'});
    const sv=document.getElementById('saved');sv.classList.add('show');clearTimeout(save.t);save.t=setTimeout(()=>sv.classList.remove('show'),1100);
  };
  document.getElementById('cancel').onclick=()=>{endEdit();render();document.body.scrollTo({top:0,behavior:'smooth'})};
  const hero=()=>{document.querySelector('.hero h1').textContent=draft.title||'Untitled';document.querySelector('.hero .by').textContent=(draft.authors||[]).join(', ')||'Unknown author';
    const t=draft.series?draft.series+(draft.seriesNo?' · Book '+draft.seriesNo:''):'';let s=document.querySelector('.hero .series');
    if(!s&&t){s=document.createElement('p');s.className='series';document.querySelector('.hero').appendChild(s)}if(s){s.textContent=t;s.hidden=!t}};
  const put=(fid,k,fix=v=>v)=>{const el=document.getElementById(fid);el.addEventListener('change',()=>{const v=fix(el.value.trim());el.value=v;if(v)draft[k]=v;else delete draft[k];hero()})};
  put('fSeries','series');put('fSeriesNo','seriesNo');put('fEdition','edition');put('fPublisher','publisher');put('fPublished','published');
  put('fPages','pages',v=>v.replace(/\D/g,''));
  document.getElementById('fGenre').addEventListener('change',e=>{draft.genre=e.target.value});
  const ft=document.getElementById('fTitle');ft.addEventListener('change',()=>{const v=ft.value.trim();if(!v){ft.value=draft.title||'';return}draft.title=v;hero()});
  const fa=document.getElementById('fAuthor');fa.addEventListener('change',()=>{const a=fa.value.split(',').map(t=>t.trim()).filter(Boolean);if(a.length)draft.authors=a;else delete draft.authors;hero()});
  // cover photo: kept aside until Save
  document.getElementById('covcam').onclick=async()=>{
    let bl=newCover;
    if(!bl&&!dropOwn){try{bl=await Store.getCoverBlob(id)}catch(e){}}
    const web=dropOwn?(real.webCover||''):(real.cover&&!Store.isOwn(real.cover)?real.cover:'');
    if(!bl&&web){try{const r=await fetch(web,{mode:'cors'});if(r.ok)bl=await r.blob()}catch(e){}}
    const own=!!newCover||(!dropOwn&&Store.isOwn(real.cover));
    const blob=await CoverPhoto.change(bl?{blob:bl,own}:null,draft.title);if(!blob)return;
    newCover=blob;dropOwn=false;if(newCoverURL)URL.revokeObjectURL(newCoverURL);newCoverURL=URL.createObjectURL(blob);render();
  };
  const og=document.getElementById('orig');
  if(og)og.onclick=()=>{newCover=null;if(newCoverURL)URL.revokeObjectURL(newCoverURL);newCoverURL=null;
    dropOwn=Store.isOwn(real.cover);draft.cover=dropOwn?real.webCover:real.cover;delete draft.color;render()};
  }
  // remove: first tap asks, second tap removes; the shelf then offers Undo for a few seconds
  const rm=document.getElementById('rm');
  if(rm)rm.onclick=async()=>{
    if(!rm.classList.contains('sure')){rm.classList.add('sure');rm.textContent='Tap again';clearTimeout(rm.t);
      rm.t=setTimeout(()=>{rm.classList.remove('sure');rm.textContent='Remove'},4000);return}
    clearTimeout(rm.t);rm.disabled=true;
    const gone=ALL.find(x=>x.id===id);
    try{await Store.remove(id)}catch(e){rm.disabled=false;return}
    try{sessionStorage.setItem('shelf.undo',JSON.stringify({book:gone,at:Date.now()}))}catch(e){}
    let r=null;try{r=new URL(document.referrer)}catch(e){}
    if(r&&r.origin===location.origin&&!/book\.html$/.test(r.pathname)&&history.length>1)history.back();
    else location.replace(gone&&gone.status==='wishlist'?'library.html?list=wishlist':'library.html');
  };
}
const reload=()=>Store.all().then(a=>{ALL=a;render()});
reload();
addEventListener('pageshow',e=>{if(e.persisted)reload()});
}
</script>
</body>
