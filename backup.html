<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="app-version" content="backup-1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0416">
<title>Backup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"IM Fell English";src:url(fonts/IMFellEnglishItalic.woff2) format("woff2");font-style:italic}
html,body{margin:0;min-height:100%;background:#0e0416;color:#f1dcc0;font-family:"EB Garamond",Georgia,serif}
body{min-height:100vh;box-sizing:border-box;background:radial-gradient(ellipse at 50% 0%,#3a1838 0%,#1a0a1e 55%,#0e0416 100%) fixed;
 padding:calc(env(safe-area-inset-top,0px) + 14px) 22px calc(env(safe-area-inset-bottom,0px) + 140px)}
.back{color:#e8c890;text-decoration:none;font-size:17px;opacity:.85}
h1{font:italic 40px/1.1 "IM Fell English",Georgia,serif;color:#f1cf7c;text-shadow:0 0 14px rgba(255,180,80,.3),0 2px 2px #000;margin:22px 0 6px;text-align:center}
.sub{text-align:center;opacity:.75;font-size:17px;margin:0 0 26px}
.card{background:linear-gradient(180deg,rgba(90,40,88,.55),rgba(46,18,48,.7));border:1.5px solid rgba(232,190,140,.45);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.card h2{margin:0 0 4px;font-size:22px;color:#f6dcb4}
.card p{margin:0 0 14px;font-size:16px;opacity:.8}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;padding:13px;border-radius:999px;font:600 18px "EB Garamond",Georgia,serif;cursor:pointer;
 color:#2a1410;background:linear-gradient(180deg,#f3d29a,#d9a066);border:0;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.btn:active{filter:brightness(1.1);transform:scale(.98)}
.status{min-height:24px;text-align:center;font-size:16px;color:#f1cf7c;margin-top:8px}
.status.err{color:#ff9a8a}
.hidden{display:none}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);
 background:linear-gradient(transparent,#0d0310 calc(100% - env(safe-area-inset-bottom,0px)))}
#tabbar .in{position:relative;width:min(100vw,640px);margin:0 auto}
#tabbar img{display:block;width:100%;height:auto;pointer-events:none}
#tabbar .tb{position:absolute;top:12%;width:18%;height:76%;border-radius:22px;-webkit-tap-highlight-color:transparent}
#tabbar .tb:active{background:radial-gradient(closest-side,rgba(255,170,90,.25),transparent)}
</style>
</head>
<body>
<h1>Backup</h1>
<p class="sub" id="count">Keep your collection safe</p>
<div class="card">
  <h2>Save a backup</h2>
  <p>Saves all your books to a file you can keep in Files or send to yourself.</p>
  <button class="btn" id="exportBtn">Save backup</button>
</div>
<div class="card">
  <h2>Restore from a backup</h2>
  <p>Adds the books from a backup file. Books you already have stay as they are.</p>
  <label class="btn" for="importFile">Choose backup file</label>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden">
</div>
<div class="status" id="status"></div>
<nav id="tabbar" aria-label="Sections">
  <div class="in">
    <img src="img/tabbar.webp" alt="">
    <a class="tb" style="left:4%" href="./" aria-label="Home"></a>
    <a class="tb" style="left:78%" href="backup.html" aria-label="Backup"></a>
  </div>
</nav>
<script src="store.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const status = (m, err) => { const s = $('status'); s.textContent = m || ''; s.className = 'status' + (err ? ' err' : ''); };
let books = [];
const load = () => Store.all().then(a => { books = a; $('count').textContent = a.length ? `${a.length} book${a.length > 1 ? 's' : ''} in your collection` : 'Keep your collection safe'; });
load(); Store.onChange(load);
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(books, null, 2)], { type: 'application/json' });
  const file = new File([blob], `shelf-backup-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
};
$('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text()); if (!Array.isArray(data)) throw 0;
    const have = new Set(books.map(b => b.id)); const fresh = data.filter(b => b && b.id && !have.has(b.id));
    fresh.forEach(b => { if (b.status !== 'wishlist') b.status = 'owned'; if (!GENRES.includes(b.genre)) b.genre = guessGenre(b); });
    await Store.replaceAll([...fresh, ...books]); await load();
    status(`Restored ${fresh.length} book${fresh.length === 1 ? '' : 's'}.`);
    fresh.forEach(b => Store.saveCover(b));
  } catch (err) { status('That file isn’t a Shelf backup.', true); }
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
