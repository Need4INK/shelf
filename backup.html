<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html{background:#0e0416;color-scheme:dark;scrollbar-width:none}::-webkit-scrollbar{display:none}</style>
<meta name="color-scheme" content="dark">
<meta name="app-version" content="backup-26">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0416">
<title>Backup</title>
<style>
html,body{margin:0;min-height:100%;background:#0e0416;color:#f1dcc0;font-family:"EB Garamond",Georgia,serif}
body{min-height:100vh;box-sizing:border-box;background:radial-gradient(ellipse at 50% 0%,#3a1838 0%,#1a0a1e 55%,#0e0416 100%) fixed;
 padding:calc(env(safe-area-inset-top,0px) + 14px) 22px calc(env(safe-area-inset-bottom,0px) + 140px)}
.back{color:#e8c890;text-decoration:none;font-size:17px;opacity:.85}
h1{font:italic 40px/1.1 "IM Fell English",Georgia,serif;color:#f1cf7c;text-shadow:0 0 14px rgba(255,180,80,.3),0 2px 2px #000;margin:2px 0 0;text-align:center}
.sub{text-align:center;opacity:.75;font-size:17px;margin:0 0 4px}
/* thin gold rule with a small star, under the book count (same as Library) */
.rule{display:flex;align-items:center;justify-content:center;gap:8px;width:62%;margin:2px auto 24px;opacity:.75}
.rule::before,.rule::after{content:"";flex:1;height:1px}
.rule::before{background:linear-gradient(90deg,transparent,#d9a95c)}
.rule::after{background:linear-gradient(90deg,#d9a95c,transparent)}
.rule svg{width:11px;height:11px;filter:drop-shadow(0 0 3px rgba(255,190,90,.6))}
/* same painted card as the Book page: purple panel + gold rim with leaf sprigs */
.card{position:relative;margin:0 0 18px;padding:26px 28px;border-radius:24px;color:#f3e3c3;
 background:linear-gradient(rgba(40,8,46,.25),rgba(20,4,26,.45)),url(img/panel.jpg) center/cover;
 box-shadow:0 10px 22px rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.4)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;border-style:solid;border-color:transparent;border-width:42px;border-image:url(img/card_frame.webp) 190 stretch}
.card>*{position:relative;z-index:1}
.card h2{margin:0 0 6px;font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:22px;color:#f1cf7c}
.card p{margin:0 0 14px;font-size:16px;opacity:.85}
.card .last{margin:10px 0 0;text-align:center;font-style:italic;font-size:15px;color:#e0c79e;opacity:.9}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;padding:13px;border-radius:999px;font:600 18px "EB Garamond",Georgia,serif;cursor:pointer;
 color:#2a1410;background:linear-gradient(180deg,#f3d29a,#d9a066);border:0;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.btn:active{filter:brightness(1.1);transform:scale(.98)}
.status{min-height:24px;text-align:center;font-size:16px;color:#f1cf7c;margin-top:8px}
.status.err{color:#ff9a8a}
.hidden{display:none}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);
 background:linear-gradient(transparent,#0d0310 calc(100% - env(safe-area-inset-bottom,0px)))}
#tabbar .in{position:relative;width:calc(824px * var(--S,.4577));margin:0 auto}
#tabbar img{display:block;width:100%;height:auto;pointer-events:none}
#tabbar .tb{position:absolute;top:8%;width:22%;height:calc(92% + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer}
#tabbar .barbook{position:absolute;left:19.21%;width:61.57%;height:auto;bottom:23.98%;pointer-events:none}
#tabbar .bookmagic{position:absolute;left:-1.6%;width:103.2%;bottom:23.98%;pointer-events:none}
#tabbar .bookhit{position:absolute;left:34.6%;width:30.8%;bottom:calc(0px - env(safe-area-inset-bottom,0px));height:calc(98% + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;cursor:pointer}
#tabbar .tb:active{background:radial-gradient(closest-side,rgba(255,170,90,.38),transparent)}
</style>
<style>/* Same as the Library: the page itself never moves or bounces, only its content scrolls (inside the body).
   On the iPhone a bouncing page swallowed taps on the bottom bar; this keeps the bar quick on every page. */
html{height:100%;overflow:hidden;overscroll-behavior:none;background:radial-gradient(ellipse at 50% 0%,#3a1838 0%,#1a0a1e 55%,#0e0416 100%)}
body{height:100%;min-height:0;box-sizing:border-box;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;background:none}
/* always a little scrollable, so a swipe never falls through to the page */
body::before{content:"";float:left;width:1px;margin-right:-1px;height:calc(100% + 1px)}
</style>
<script>(function(){
  const p=document.createElement('div');p.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
  document.documentElement.appendChild(p);
  const fit=()=>document.documentElement.style.setProperty('--S',Math.max(innerWidth/852,(innerHeight-(p.offsetHeight||0))/1810));
  fit();addEventListener('resize',fit);
  // tapping Home when we came from Home: go back, so the phone shows the Home it kept in memory (no rebuild)
  // bar buttons have no web link (a long press would open the iPhone link menu); go there on tap
  addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('#tabbar [data-go]');if(a&&!e.defaultPrevented){e.preventDefault();location.href=a.dataset.go}});
  // iPhone only shows the pressed glow when the page listens for touches
  document.addEventListener('touchstart',()=>{},{passive:true});
  // the bar keeps its own touches: it never scrolls what is under it (the shelves on Library/Wishlist could take the
  // touch, so taps were lost), and lifting the finger on the same button counts as a tap
  document.addEventListener('DOMContentLoaded',()=>{const t=document.getElementById('tabbar');if(!t)return;
    t.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
    t.addEventListener('touchend',e=>{const a=e.target.closest&&e.target.closest('.tb'),p=e.changedTouches[0];if(!a||!p)return;
      const h=document.elementFromPoint(p.clientX,p.clientY);if(h&&h.closest&&h.closest('.tb')===a&&e.cancelable){e.preventDefault();a.click()}});});
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('#tabbar a[aria-label="Home"]');if(!a)return;
    let r=null;try{r=new URL(document.referrer)}catch(err){}
    if(r&&r.origin===location.origin&&/\/(index\.html)?$/.test(r.pathname)&&history.length>1){e.preventDefault();
      // if the phone ignores going back (it can, e.g. after the app was in the background), open Home directly
      const t=setTimeout(()=>{location.href=a.dataset.go||'index.html'},600);addEventListener('pagehide',()=>clearTimeout(t),{once:true});history.back()}});
})();</script>
<style>/* All app lettering, kept in the app (no Google Fonts) so text never swaps fonts when a page opens. OFL. */
@font-face{font-family:"EB Garamond";font-weight:400;src:url(fonts/EBGaramond-400.woff2) format("woff2");font-display:block}
@font-face{font-family:"EB Garamond";font-weight:500;src:url(fonts/EBGaramond-500.woff2) format("woff2");font-display:block}
@font-face{font-family:"EB Garamond";font-weight:600;src:url(fonts/EBGaramond-600.woff2) format("woff2");font-display:block}
@font-face{font-family:"EB Garamond";font-weight:700;src:url(fonts/EBGaramond-700.woff2) format("woff2");font-display:block}
@font-face{font-family:"EB Garamond";font-weight:400;font-style:italic;src:url(fonts/EBGaramond-400i.woff2) format("woff2");font-display:block}
@font-face{font-family:"IM Fell English";src:url(fonts/IMFellEnglish.woff2) format("woff2");font-display:block}
@font-face{font-family:"IM Fell English";font-style:italic;src:url(fonts/IMFellEnglishItalic.woff2) format("woff2");font-display:block}
@font-face{font-family:"IM Fell English SC";src:url(fonts/IMFellEnglishSC.woff2) format("woff2");font-display:block}
</style>
</head>
<body>
<h1>Backup</h1>
<p class="sub" id="count">Keep your collection safe</p>
<div class="rule" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M5 0L6.2 3.8 10 5 6.2 6.2 5 10 3.8 6.2 0 5 3.8 3.8z" fill="#f1cf7c"/></svg></div>
<div class="card">
  <h2>Save a backup</h2>
  <p>Saves all your books and their covers in one file you can keep in Files or send to yourself.</p>
  <button class="btn" id="exportBtn">Save backup</button>
  <p class="last" id="lastSave"></p>
</div>
<div class="card">
  <h2>Restore a backup</h2>
  <p>Adds the books from a backup file. Books you already have stay as they are.</p>
  <label class="btn" for="importFile">Restore backup</label>
  <input type="file" id="importFile" accept=".zip,application/zip,application/x-zip-compressed,application/json,.json" class="hidden">
  <p class="last" id="lastRestore"></p>
</div>
<div class="status" id="status"></div>
<nav id="tabbar" aria-label="Sections">
  <div class="in">
    <img src="img/tabbar.webp" width="851" height="171" alt="">
    <img class="barbook" src="img/bar_book.webp" alt="">
    <a class="tb" style="left:0" data-go="./" role="link" aria-label="Home"></a>
    <a class="tb" style="left:78%" data-go="backup.html" role="link" aria-label="Backup"></a>
  </div>
</nav>
<script src="bookmagic.js"></script>
<script src="store.js"></script>
<script src="zip.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const status = (m, err) => { const s = $('status'); s.textContent = m || ''; s.className = 'status' + (err ? ' err' : ''); };
let books = [];
const load = () => Store.all().then(a => { books = a; $('count').textContent = a.length ? `${a.length} book${a.length > 1 ? 's' : ''} in your collection` : 'Keep your collection safe'; });
load(); Store.onChange(load);
// when the last backup / restore was done (kept on this phone)
const when = t => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(',', ' ·');
const showLast = () => { let s = null, r = null; try { s = localStorage.getItem('backup.saved'); r = localStorage.getItem('backup.restored'); } catch (e) {}
  $('lastSave').textContent = s ? `Last backup: ${when(+s)}` : 'No backup saved yet';
  $('lastRestore').textContent = r ? `Last restore: ${when(+r)}` : 'Nothing restored yet'; };
const mark = k => { try { localStorage.setItem(k, Date.now()); } catch (e) {} showLast(); };
showLast();
const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif' }, TYPE = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif' };
const bytes = async b => new Uint8Array(await b.arrayBuffer());
$('exportBtn').onclick = async () => {
  // one .zip: backup.json (the books + the list of removed books, so restoring an older backup never brings removed books back)
  // + covers/<book id>.jpg for every cover on the phone, so a restore needs no internet
  const btn = $('exportBtn'); if (btn.disabled) return; btn.disabled = true; status('Packing your books and covers…');
  let blob;
  try {
    const { data, covers } = await Store.backupWithCovers(), files = [];
    files.push({ name: 'backup.json', data: new TextEncoder().encode(JSON.stringify(data, null, 2)) });
    for (const [id, bl] of covers) files.push({ name: 'covers/' + encodeURIComponent(id) + '.' + (EXT[bl.type] || 'jpg'), data: await bytes(bl) });
    blob = Zip.make(files);
    status(`Backup ready: ${data.books.length} book${data.books.length === 1 ? '' : 's'} · ${covers.size} cover${covers.size === 1 ? '' : 's'}`);
  } catch (err) { status('Could not make the backup.', true); btn.disabled = false; return; }
  btn.disabled = false;
  const file = new File([blob], `shelf-backup-${new Date().toISOString().slice(0, 10)}.zip`, { type: 'application/zip' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { share(file); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); mark('backup.saved');
};
// the iPhone only opens the Share menu straight after a tap; if packing the covers took too long, one more tap opens it
function share(file) {
  navigator.share({ files: [file] }).then(() => mark('backup.saved')).catch(err => {
    if (!err || err.name !== 'NotAllowedError') return;
    const btn = $('exportBtn'), was = btn.onclick; btn.textContent = 'Share the backup file';
    btn.onclick = () => { btn.textContent = 'Save backup'; btn.onclick = was; share(file); };
  });
}
// restore: each book keeps whichever copy was changed last (phone or backup); removed books stay removed
$('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let n;
  status('Reading the backup…');
  try {
    const buf = await f.arrayBuffer(), head = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));
    if (head[0] === 0x50 && head[1] === 0x4b) {          // "PK": the .zip backup (books + covers)
      const z = await Zip.read(buf), j = z.get('backup.json'); if (!j) throw new Error('no backup.json');
      const covers = new Map();
      for (const [name, d] of z) { const m = name.match(/^covers\/(.+)\.(\w+)$/); if (m && d) covers.set(decodeURIComponent(m[1]), new Blob([d], { type: TYPE[m[2].toLowerCase()] || 'image/jpeg' })); }
      n = await Store.restore(JSON.parse(new TextDecoder().decode(j)), covers);
    } else n = await Store.restore(JSON.parse(new TextDecoder().decode(buf)));   // older .json backups still work
  }
  catch (err) { status('That file isn’t a Shelf backup.', true); return; }
  await load(); mark('backup.restored');
  const bk = k => `${k} book${k === 1 ? '' : 's'}`, parts = [];
  if (n.added) parts.push(`Added ${bk(n.added)}`);
  if (n.updated) parts.push(`Updated ${bk(n.updated)}`);
  if (n.removed) parts.push(`Removed ${bk(n.removed)}`);
  if (n.keptAway) parts.push(`${bk(n.keptAway)} you removed stayed removed`);
  status(parts.length ? parts.join(' · ') + '.' : 'Everything was already up to date.');
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
